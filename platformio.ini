; 0n3Pork W3b - one tree, one binary per chip
; C3 firmware will not boot on S3 (and the other way around).
; Pick the env that matches the silicon, then set the button GPIO in the web UI.

[platformio]
default_envs = stampc3

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
lib_deps = bblanchon/ArduinoJson@^7.4.2
extra_scripts = pre:scripts/pre_build.py
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_MDNS_HOSTNAME=\"on3pork\"
    -DCONFIG_ESP_WIFI_LOG_LEVEL=2
    -Wl,--allow-multiple-definition
    -include src/build_info.h
    -include src/compat.h

; ----- ESP32-C3 -----

[env:stampc3]
platform = ${common.platform}
board = esp32-c3-devkitm-1
framework = ${common.framework}
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DBOARD_NAME=\"M5Stamp-C3\"
    -DBUTTON_GPIO_DEFAULT=3

[env:esp32c3]
platform = ${common.platform}
board = esp32-c3-devkitm-1
framework = ${common.framework}
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DBOARD_NAME=\"ESP32-C3\"
    -DBUTTON_GPIO_DEFAULT=9

; ----- ESP32-S3 -----
; Default 4 MB + DIO so N4 / SuperMini / cheap modules boot.
; An 8 MB header on a 4 MB chip loops: "Detected size(4096k) smaller..."
; Native USB (XIAO / SuperMini / USB-OTG port)

[env:esp32s3]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = ${common.framework}
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DBOARD_NAME=\"ESP32-S3-USB\"
    -DBUTTON_GPIO_DEFAULT=0

; UART USB-serial chip (many DevKitC-1 "COM" ports)

[env:esp32s3uart]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = ${common.framework}
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_flags =
    ${common.build_flags}
    -DBOARD_NAME=\"ESP32-S3-UART\"
    -DBUTTON_GPIO_DEFAULT=0

; Optional: official DevKitC-1 N8 (8 MB). Do not use on 4 MB modules.

[env:esp32s3-8m]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = ${common.framework}
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_DFU_ON_BOOT=0
    -DBOARD_NAME=\"ESP32-S3-8M\"
    -DBUTTON_GPIO_DEFAULT=0

; ----- ESP32 classic (WROOM / DevKit) -----

[env:esp32]
platform = ${common.platform}
board = esp32dev
framework = ${common.framework}
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
build_flags =
    ${common.build_flags}
    -DBOARD_NAME=\"ESP32\"
    -DBUTTON_GPIO_DEFAULT=0

